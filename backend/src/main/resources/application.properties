# Server
server.port=8080

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:testflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mock embedded LDAP (UnboundID)
spring.ldap.embedded.ldif=classpath:mock-ldap.ldif
spring.ldap.embedded.base-dn=dc=testflow,dc=com
spring.ldap.embedded.port=8389

# LDAP bağlantı (embedded'e işaret ediyor — gerçek AD'ye geçince burası değişir)
spring.ldap.urls=ldap://localhost:8389
spring.ldap.base=dc=testflow,dc=com
spring.ldap.username=cn=admin,dc=testflow,dc=com
spring.ldap.password=admin

# JWT
app.jwt.secret=demo-jwt-secret-testflow-web-gizli-256bit-anahtar!
app.jwt.expiration-ms=604800000

# CORS (React dev server)
app.cors.allowed-origins=http://localhost:5173

# Loglama
logging.level.com.testflow=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.ldap=WARN
